<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIBERLOGA CLUB</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Orbitron', Arial, sans-serif;
    color: white;
    overflow-x: hidden;
}

/* ФОН (оставляем видео, но делаем красиво) */
.video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: -1;
}

/* ШАПКА */
.header {
    text-align: center;
    padding: 60px 15px 30px;
}

.header h1 {
    font-size: 34px;
    color: #ff2e6e;
    text-shadow: 0 0 20px rgba(255, 46, 110, 0.6);
}

.header p {
    opacity: 0.7;
    margin-top: 8px;
}

/* СЕТКА */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
    padding: 15px;
    max-width: 1100px;
    margin: 0 auto;
}

/* КАРТОЧКИ (ГЛАВНЫЙ УЛУЧШЕННЫЙ ДИЗАЙН) */
.card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 18px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: 0.25s ease;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.card:hover {
    transform: translateY(-6px);
    border-color: rgba(255, 46, 110, 0.5);
    box-shadow: 0 15px 40px rgba(255, 46, 110, 0.15);
}

/* ЗАГОЛОВКИ */
.card h2 {
    font-size: 18px;
    color: #ffffff;
}

/* ТЕКСТ */
.card p {
    font-size: 14px;
    opacity: 0.8;
}

/* КНОПКИ */
.button {
    display: inline-block;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    text-decoration: none;
    color: white;

    background: linear-gradient(135deg, #ff2e6e, #ff7a18);
    box-shadow: 0 8px 20px rgba(255, 46, 110, 0.25);

    transition: 0.2s;
}

.button:hover {
    transform: scale(1.03);
}

/* КАРТА */
.map {
    width: 100%;
    height: 220px;
    border: none;
    border-radius: 14px;
}

/* TELEGRAM BUTTON */
.telegram {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background: #0088cc;
    padding: 14px 18px;
    border-radius: 50px;
    font-weight: bold;
    text-decoration: none;
    color: white;
    box-shadow: 0 10px 25px rgba(0,136,204,0.4);
}

/* МОБИЛКА */
@media (max-width: 768px) {
    .header h1 {
        font-size: 26px;
    }

    .container {
        grid-template-columns: 1fr;
        padding: 10px;
    }

    .card {
        padding: 15px;
    }

    .button {
        width: 100%;
    }
}

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image: url("https://images.unsplash.com/photo-1542751371-adc38448a05e");
    background-size: cover;
    background-position: center;

    z-index: -2;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}
</style>
</head>

<body>
